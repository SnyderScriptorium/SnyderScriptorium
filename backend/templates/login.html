<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Georgia", serif;
            background-color: #f5f0e8;
            color: #3b2a1a;
        }

        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: #fffaf2;
            border: 1px solid #d3c4a3;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #c2b39a;
            background-color: #fffdf7;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background-color: #6b4b2f;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #4f3621;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
