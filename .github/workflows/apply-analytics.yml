name: Apply analytics implementation

on:
  push:
    paths:
      - 'scripts/implement_analytics.py'
      - '.github/workflows/apply-analytics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply analytics changes
        run: python scripts/implement_analytics.py

      - name: Commit analytics changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/admin.html
          if git diff --cached --quiet; then
            echo "No analytics changes needed."
            exit 0
          fi
          git commit -m "Add database-backed analytics dashboard"
          git push

      - name: Remove temporary implementation files
        run: |
          git rm -f scripts/implement_analytics.py .github/workflows/apply-analytics.yml
          git commit -m "Remove temporary analytics implementation workflow"
          git push
