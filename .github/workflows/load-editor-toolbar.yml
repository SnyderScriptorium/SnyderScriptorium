name: Load admin editor enhancements
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure targeted admin editor script is loaded and redundant toolbar loader is removed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/admin.html')
          text = p.read_text(encoding='utf-8')
          legacy = '<script src="{{ url_for(\'static\', filename=\'editor_toolbar.js\') }}"></script>'
          targeted = '<script src="{{ url_for(\'static\', filename=\'admin_targeted_fixes.js\') }}"></script>'
          text = text.replace(legacy + '\n', '')
          if targeted not in text:
              marker = '<script>\nconst urls='
              text = text.replace(marker, targeted + '\n' + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/admin.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Use single targeted admin editor enhancement layer'
            git push
          fi
