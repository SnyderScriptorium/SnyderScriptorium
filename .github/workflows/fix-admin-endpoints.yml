name: Fix admin endpoint names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix stale Flask endpoint names in admin template
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("templates/admin.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "url_for('get_published_posts')": "url_for('get_published')",
              'url_for("get_published_posts")': 'url_for("get_published")',
              "url_for('create_published_post')": "url_for('create_published')",
              'url_for("create_published_post")': 'url_for("create_published")',
          }
          original = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              print("No stale admin endpoint names found.")
          else:
              path.write_text(text, encoding="utf-8")
              print("Updated stale admin endpoint names.")
          PY

      - name: Commit corrected admin template
        run: |
          if git diff --quiet -- templates/admin.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/admin.html
          git commit -m "Fix admin template endpoint names"
          git push
