<div class="two" style="margin-top:18px"><div class="preview"><h3 class="section-title">Views by Section</h3><div id="analyticsCategories" class="list"></div></div><div class="preview"><h3 class="section-title">Most Viewed Posts</h3><div id="analyticsPosts" class="list"></div></div></div>
<p class="note" style="margin-top:18px">Analytics are stored in the database. Visitor tracking is designed so analytics failures never prevent someone from reading the site.</p></section>'''
          if old not in s:
