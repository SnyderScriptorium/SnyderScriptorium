          helper = '''def record_page_view(path, page_type="page", content_id=None, category=None):
    """Record a public/member page view in the persistent database."""
    if path.startswith("/static/") or path.startswith("/api/"):
        return
    try:
        conn = get_db()
        conn.execute(
            "INSERT INTO page_views(path, page_type, content_id, category) VALUES (?, ?, ?, ?)",
            (path, page_type, content_id, category),
        )
        conn.commit()
        conn.close()
    except Exception:
        # Analytics must never prevent a visitor from reading the site.
        try:
            conn.close()
        except Exception:
            pass


def category_label(category):
