<h2 class="section-title">Analytics</h2>
<div class="actions" style="margin-bottom:15px"><button type="button" class="light" onclick="loadStats('7')">7 Days</button><button type="button" class="light" onclick="loadStats('30')">30 Days</button><button type="button" class="light" onclick="loadStats('90')">90 Days</button><button type="button" class="light" onclick="loadStats('365')">1 Year</button><button type="button" class="light" onclick="loadStats('all')">All Time</button></div>
<div class="three"><div class="card"><div><h3>Total Views</h3><small>Selected period</small></div><strong id="statViews">0</strong></div><div class="card"><div><h3>Published</h3><small>Live posts</small></div><strong id="statPublished">0</strong></div><div class="card"><div><h3>Novels</h3><small>Manuscript books</small></div><strong id="statBooks">0</strong></div></div>
