          analytics_routes = '''@app.route("/api/analytics", methods=["GET"])
@admin_required
def get_analytics():
    from datetime import datetime, timedelta, timezone
    period = request.args.get("period", "30")
    now = datetime.now(timezone.utc)
    if period == "all":
        start = None
    else:
        try:
            days = max(1, min(int(period), 3650))
        except ValueError:
            days = 30
        start = now - timedelta(days=days)

    conn = get_db()
    where = "" if start is None else " WHERE viewed_at >= ?"
    params = () if start is None else (start.isoformat(),)
    total = conn.execute("SELECT COUNT(*) AS count FROM page_views" + where, params).fetchone()["count"]
    posts = conn.execute("SELECT path, content_id, category, COUNT(*) AS views FROM page_views WHERE page_type = 'post'" + (" AND viewed_at >= ?" if start else "") + " GROUP BY path, content_id, category ORDER BY views DESC", (() if not start else (start.isoformat(),))).fetchall()
    categories = conn.execute("SELECT category, COUNT(*) AS views FROM page_views WHERE category IS NOT NULL" + (" AND viewed_at >= ?" if start else "") + " GROUP BY category ORDER BY views DESC", (() if not start else (start.isoformat(),))).fetchall()
    daily = conn.execute("SELECT DATE(viewed_at) AS day, COUNT(*) AS views FROM page_views" + where + " GROUP BY DATE(viewed_at) ORDER BY day", params).fetchall()
    conn.close()

    return jsonify({
        "period": period,
        "total_views": total,
        "daily": [dict(r) for r in daily],
        "categories": [dict(r) for r in categories],
        "posts": [dict(r) for r in posts],
    })


@app.route("/api/drafts", methods=["GET"])
