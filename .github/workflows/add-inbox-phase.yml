name: Build Inbox Phase
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply inbox changes
        run: python scripts/apply_inbox_phase.py
      - name: Validate Python
        run: python -m py_compile app.py database.py scripts/apply_inbox_phase.py
      - name: Commit inbox changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py database.py templates/admin.html templates/contact.html templates/admin_inbox.html
          git commit -m "Add Phase 2 admin inbox and contact form"
          git push
          rm scripts/apply_inbox_phase.py .github/workflows/add-inbox-phase.yml
          git add scripts/apply_inbox_phase.py .github/workflows/add-inbox-phase.yml
          git commit -m "Remove temporary inbox implementation files"
          git push
