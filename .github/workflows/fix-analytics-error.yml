name: Fix analytics dashboard error
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix analytics refresh error
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/admin.html')
          s = p.read_text(encoding='utf-8')
          old = 'if(drafts.status==="fulfilled"){$("draftCount").textContent=drafts.value.length;$("statDrafts").textContent=drafts.value.length}'
          new = 'if(drafts.status==="fulfilled"){$("draftCount").textContent=drafts.value.length;const draftStat=$("statDrafts");if(draftStat)draftStat.textContent=drafts.value.length}'
          if old not in s:
              raise SystemExit('Expected analytics refresh code was not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/admin.html .github/workflows/fix-analytics-error.yml
          git commit -m "Fix analytics dashboard refresh error"
          git push
          git rm .github/workflows/fix-analytics-error.yml
          git commit -m "Remove temporary analytics fix workflow"
          git push
