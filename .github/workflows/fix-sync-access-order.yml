name: Fix sync access initialization order
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix initialization order
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('templates/admin.html')
          s=p.read_text(encoding='utf-8')
          old='function syncAccess(){const locked=effectivePostCategory()==="kwsnyderwriting";$("postAccess").value=locked?"members":"public";$("postAccess").disabled=locked}'
          new='function syncAccess(){const category=window.effectivePostCategory?window.effectivePostCategory():$("postCategory").value;const locked=category.startsWith("kw");$("postAccess").value=locked?"members":"public";$("postAccess").disabled=locked}'
          assert old in s, 'syncAccess function not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix admin editor initialization order'
          git push
