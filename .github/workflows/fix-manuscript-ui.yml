name: Fix manuscript UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[manuscript-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manuscript workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('templates/admin.html')
          s = p.read_text(encoding='utf-8')
          old = '''function clearBookForm(){currentBookId=null;$("bookTitle").value="";$("bookDescription").value="";$("selectedBook").textContent="New book — enter its title and description, then Save Book.";$("chapterStudio").classList.add("hidden");document.querySelectorAll('.book-entry').forEach(b=>b.classList.remove('active'));clearChapterForm()}'''
          new = '''function clearBookForm(){currentBookId=null;$("bookTitle").value="";$("bookDescription").value="";$("selectedBook").innerHTML="<strong>New Book</strong><br><span class='note'>Enter your novel title and description, then click <strong>Save Book &amp; Open Chapter 1</strong>. Your full chapter writing desk will open automatically after the book is saved.</span>";$("chapterStudio").classList.add("hidden");document.querySelectorAll('.book-entry').forEach(b=>b.classList.remove('active'));clearChapterForm();setTimeout(()=>$("bookTitle").focus(),0)}'''
          if old not in s:
              raise SystemExit('Expected manuscript function was not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          old_btn = '<button type="button" onclick="saveBook()">Save Book</button>'
          new_btn = '<button type="button" onclick="saveBook()">Save Book &amp; Open Chapter 1</button>'
          if old_btn not in s:
              raise SystemExit('Expected Save Book button was not found; refusing to modify the file.')
          s = s.replace(old_btn, new_btn, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-manuscript-ui.yml
      - name: Commit manuscript UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/admin.html .github/workflows/fix-manuscript-ui.yml
          git commit -m 'Fix manuscript new-book workflow [manuscript-fix]'
          git push
