name: Repair domain routing safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good app and apply domain configuration
        run: |
          set -e
          git checkout 35dab58535b66a188dd6e658fb25ab3cea71ad18 -- app.py
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text()
          old = '''    SESSION_COOKIE_SECURE=os.environ.get("RENDER", "").lower() == "true" or os.environ.get("FLASK_ENV") == "production",\n    SESSION_PERMANENT=False,\n)'''
          new = '''    SESSION_COOKIE_SECURE=os.environ.get("RENDER", "").lower() == "true" or os.environ.get("FLASK_ENV") == "production",\n    SESSION_PERMANENT=False,\n    MAIN_DOMAIN=os.environ.get("MAIN_DOMAIN", "snyderscriptorium.com").strip().lower(),\n    KWSNYDER_DOMAIN=os.environ.get("KWSNYDER_DOMAIN", "kwsnyderwriting.com").strip().lower(),\n)'''
          if old not in text:
              raise SystemExit('Expected Flask config block not found')
          text = text.replace(old, new, 1)

          old = '''def is_kw_domain():\n    configured = os.environ.get("KWSNYDER_DOMAIN", "").strip().lower()\n    if not configured:\n        return False\n    host = request.host.split(":")[0].lower()\n    return host in {configured, f"www.{configured}"}\n\n\n@app.before_request\ndef route_kw_domain():\n    if not is_kw_domain() or request.path.startswith("/static/"):\n        return None\n    if request.path.startswith("/kwsnyderwriting"):\n        return None\n    if request.path == "/":\n        return redirect(url_for("kwsnyderwriting_membership"))\n    return None'''
          new = '''def is_kw_domain():\n    configured = app.config.get("KWSNYDER_DOMAIN", "").strip().lower()\n    if not configured:\n        return False\n    host = request.host.split(":")[0].lower()\n    return host in {configured, f"www.{configured}"}\n\n\ndef main_site_url(path="/"):\n    path = str(path or "/")\n    if not path.startswith("/"):\n        path = "/" + path\n    return f"https://{app.config['MAIN_DOMAIN']}{path}"\n\n\ndef kw_site_url(path="/"):\n    path = str(path or "/")\n    if not path.startswith("/"):\n        path = "/" + path\n    return f"https://{app.config['KWSNYDER_DOMAIN']}{path}"\n\n\n@app.context_processor\ndef domain_urls():\n    return {"main_site_url": main_site_url, "kw_site_url": kw_site_url, "is_kw_domain": is_kw_domain}\n\n\n@app.before_request\ndef route_kw_domain():\n    if not is_kw_domain() or request.path.startswith("/static/"):\n        return None\n    if request.path.startswith("/kwsnyderwriting"):\n        return None\n    if request.path == "/":\n        return redirect(url_for("member_login"))\n    return None'''
          if old not in text:
              raise SystemExit('Expected domain routing block not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          base = Path('templates/base.html')
          t = base.read_text()
          replacements = {
              '{{ url_for(\'the_hearth\') }}': '{{ main_site_url(\'/\') }}',
              '{{ url_for(\'about\') }}': '{{ main_site_url(\'/about\') }}',
              '{{ url_for(\'the_blog\') }}': '{{ main_site_url(\'/blog\') }}',
              '{{ url_for(\'kwsnyderwriting_membership\') }}': '{{ kw_site_url(\'/kwsnyderwriting/membership\') }}',
              '{{ url_for(\'the_scriptorium\') }}': '{{ main_site_url(\'/store\') }}',
              '{{ url_for(\'merch_shop\') }}': '{{ main_site_url(\'/merch\') }}',
              '{{ url_for(\'contact\') }}': '{{ main_site_url(\'/contact\') }}',
              '{{ url_for(\'admin_dashboard\') }}': '{{ main_site_url(\'/admin\') }}',
          }
          for a, b in replacements.items():
              t = t.replace(a, b)
          base.write_text(t)

          membership = Path('templates/blog_templates/kwsnyderwriting_membership.html')
          t = membership.read_text()
          t = t.replace('Continue securely through PayPal Sandbox to start your membership.', 'Continue securely through PayPal to start your membership.')
          t = t.replace('Check that the Sandbox Client ID and membership plan belong to the same PayPal app.', 'Check that your PayPal Live credentials and membership plan are configured correctly.')
          t = t.replace('Check the Sandbox Client ID and plan configuration.', 'Check the PayPal Live configuration and membership plan.')
          membership.write_text(t)

          pp = Path('paypal_subscriptions.py')
          t = pp.read_text()
          t = t.replace('os.environ.get("PAYPAL_ENV", "sandbox").lower() != "live"', 'os.environ.get("PAYPAL_ENV", "sandbox").strip().lower() != "live"')
          pp.write_text(t)
          PY

      - name: Remove temporary repair workflow
        run: rm -f .github/workflows/repair-domain-routing.yml

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/base.html templates/blog_templates/kwsnyderwriting_membership.html paypal_subscriptions.py .github/workflows/repair-domain-routing.yml
          git commit -m "Restore app and configure two-domain membership routing"
          git push origin main
