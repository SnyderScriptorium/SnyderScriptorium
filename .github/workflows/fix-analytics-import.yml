name: Fix analytics import

on:
  push:
    paths:
      - '.github/workflows/fix-analytics-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing re import and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          if '\nimport re\n' not in s:
              s = s.replace('import os\n', 'import os\nimport re\n', 1)
              p.write_text(s)
          compile(p.read_text(), 'app.py', 'exec')
          print('app.py syntax validation passed')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix analytics request tracker import"
          git push
      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/fix-analytics-import.yml
          git commit -m "Remove temporary analytics import workflow"
          git push
