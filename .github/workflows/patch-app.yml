name: Patch app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('if category == "kwsnyderwriting":\n        access = "members"', 'if category == "kwsnyderwriting" or category.startswith("kw_"):\n        access = "members"')
          if 'def membership_terms' not in s:
              marker = '@app.route("/kwsnyderwriting"'
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('KWS route marker not found')
              route = '@app.route("/membership-terms")\ndef membership_terms():\n    return render_template("blog_templates/membership_terms.html")\n\n\n'
              s = s[:idx] + route + s[idx:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Protect KWS subcategories and add membership terms route'
          git push
