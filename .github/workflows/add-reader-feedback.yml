name: Add Reader Feedback
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-reader-feedback.yml'
permissions:
  contents: write
jobs:
  build-reader-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply changes
        run: python .github/apply_reader_feedback.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/blog_templates/chapter.html
          git diff --cached --check
          git commit -m "Add subscriber reader feedback"
          git push
          git rm .github/workflows/add-reader-feedback.yml .github/apply_reader_feedback.py
          git commit -m "Remove temporary reader feedback workflow"
          git push
