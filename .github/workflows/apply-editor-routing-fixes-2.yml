name: Apply editor routing fixes 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('templates/admin.html')
          s=p.read_text(encoding='utf-8')
          marker='<label>Access</label>'
          if 'id="postKWSubcategory"' not in s:
              insert='<div id="postKWSubcategoryWrap" class="hidden"><label>K. W. Snyder Writing — Subcategory</label><select id="postKWSubcategory"><option value="kwsnyderwriting">General Writing</option><option value="kw_short_stories">Short Stories</option><option value="kw_poems">Poems</option><option value="kw_vignettes">Vignettes</option></select></div>'
              assert marker in s, 'Access marker missing'
              s=s.replace(marker,insert+marker,1)
          js='''<script>\n(function(){\nfunction wire(){const c=document.getElementById("postCategory"),w=document.getElementById("postKWSubcategoryWrap"),sub=document.getElementById("postKWSubcategory");if(!c||!w||!sub)return;if(c.dataset.kwWired)return;c.dataset.kwWired="1";[...c.options].filter(o=>["kw_short_stories","kw_poems","kw_vignettes"].includes(o.value)).forEach(o=>o.hidden=true);c.dataset.effectiveKW=sub.value;function sync(){const kw=c.value==="kwsnyderwriting"||c.value.startsWith("kw_");w.classList.toggle("hidden",!kw);if(c.value.startsWith("kw_")&&c.value!=="kwsnyderwriting")sub.value=c.value;if(kw)c.value="kwsnyderwriting";c.dataset.effectiveKW=sub.value;}c.addEventListener("change",sync);sub.addEventListener("change",()=>c.dataset.effectiveKW=sub.value);window.effectivePostCategory=()=>c.value==="kwsnyderwriting"?(c.dataset.effectiveKW||sub.value):c.value;sync();}\nfunction manuscript(){document.addEventListener("keydown",e=>{const ed=e.target&&e.target.closest&&e.target.closest("#chapterEditor[contenteditable=\\"true\\"]");if(!ed||e.key!=="Tab")return;e.preventDefault();e.stopPropagation();document.execCommand("indent",false,null)},true);}\ndocument.addEventListener("DOMContentLoaded",()=>{wire();manuscript()});\n})();\n</script>\n'''
          if 'function wire(){const c=document.getElementById("postCategory")' not in s:
              pos=s.rfind('</body>')
              assert pos>=0, 'body marker missing'
              s=s[:pos]+js+s[pos:]
          s=s.replace('$("postCategory").value','effectivePostCategory()').replace("$('postCategory').value",'effectivePostCategory()')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix K W subcategory routing and manuscript tab indentation'
          git push
