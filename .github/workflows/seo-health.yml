name: SEO and Google Crawl Health

# Read-only scheduled monitoring. It never edits store.py, inventory, or
# database data. Google discovers ordinary web pages through crawlable links
# and sitemaps; Google's Indexing API is not used because Google limits that
# API to eligible JobPosting and livestream/video pages.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Check public SEO endpoints
        env:
          SEO_BASE_URL: https://www.snyderscriptorium.com
        run: python scripts/seo_health_check.py
