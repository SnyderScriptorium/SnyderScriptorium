<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snyder Scriptorium</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #E8D9B5;
    color: #3A3A3A;
    font-family: "Playfair Display", serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 90vh;
  }
  
  .top-left-logo {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #5C4033;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    margin: 0 auto 15px auto;
    display: block;
  }

  .main-content {
    flex: 1;
    text-align: center;
  }

  h1 {
    color: #2F4F2F;
    font-weight: 300;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    line-height: 1.2;
    margin: 0 0 5px 0;
  }

  h2 {
    color: #5C4033;
    font-weight: 300;
    font-size: clamp(1.1rem, 3vw, 1.8rem);
    line-height: 1.3;
    margin: 0 0 25px 0;
  }

  .nav-menu {
    margin-top: 25px;
    font-size: 1.1rem;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  .nav-menu a {
    text-decoration: none;
    color: #2F4F2F;
    font-weight: 400;
  }

  .content-section {
    margin-top: 35px;
    font-size: 1.15rem;
    line-height: 1.7;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.9rem;
  }

  /* Desktop layout: puts the logo back in the top-left corner on bigger screens */
  @media (min-width: 800px) {
    body {
      padding: 40px;
    }
    .top-left-logo {
      position: absolute;
      top: 25px;
      left: 25px;
      width: 150px;
      height: 150px;
      margin: 0;
    }
  }
</style>
</head>
<body>

<div class="main-content">
  <img src="logo3.png" alt="Snyder Scriptorium Logo" class="top-left-logo">
  
  <h1>Snyder Scriptorium</h1>
  <h2>K.W. Snyder Writing</h2>

  <div class="nav-menu">
    <a href="about.html">About</a>
    <a href="theblog.html">The Blog</a>
    <a href="thescriptorium.html">The Scriptorium</a>
    <a href="merchstore.html">Merch Store</a>
  </div>

  <div class="content-section">
    <p>This site is under construction while I build out the bookstore, merch shop, and blog.</p>
  </div>
</div>

<footer>
  <p>&copy; 2026 Snyder Scriptorium &nbsp;|&nbsp; <a href="admin.html" style="color: #5C4033; text-decoration: none; font-weight: 600;">Admin</a></p>
</footer>

</body>
</html>
