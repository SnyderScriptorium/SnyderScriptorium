<title>Snyder Scriptorium</title> 
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap');
  body {
    background-color: #E8D9B5; /* Light Cream Camel */
    color: #3A3A3A; /* Neutral text color for readability */
    font-family: "Cormorant Garamond", serif;
    font-size: 22px; 
    font-weight: 300; 
    letter-spacing: 1px; 
    text-align: center;
    padding-top: 50px;
}
  h1 {
     color: #000C36; /* Navy Blue */
     font-size: 42px; 
     font-weight: 300;
     margin-bottom: 5px;
    }
  h2 { 
    color: #C9A86A; /* Dark Gold */
    font-family: "Cormorant Garamond", serif;
    font-size: 32px; 
    font-weight: 300; 
    letter-spacing: 0.5px;
    margin-top: 0;
} 

  /* Navigation Menu Layout */
  .nav-menu {
    display: flex;
    justify-content: center;
    gap: 40px; /* Creates nice, even space between each link */
    margin: 30px 0;
  }

  .nav-menu a {
    color: #3A3A3A; 
    text-decoration: none; 
    font-size: 22px;
    letter-spacing: 1px;
    transition: color 0.3s ease; 
  }

  .nav-menu a:hover {
    color: #000C36; /* Shifts to navy blue on hover */
  }

  /* The Separation Line and Content Box */
  .content-section {
    border-top: 1px solid #C9A86A; /* Delicate gold line */
    width: 60%;
    margin: 0 auto; 
    padding-top: 30px; 
  }
</style>
</head>
