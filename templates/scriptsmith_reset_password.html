<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ScriptSmith</title>
<style>
  body{font-family:Georgia,serif;background:#f5f0e8;color:#2a2219;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}
  .card{background:#fffdf8;border:1px solid #ddd2c0;border-radius:12px;padding:40px 30px;max-width:420px;box-shadow:0 8px 30px rgba(42,34,25,.08)}
  .mark{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:#5b4a36;color:#fff;font-weight:800;font-size:1.8rem;margin:0 auto 18px}
  h1{margin:0 0 10px;font-size:1.4rem}
  p{color:#6b5f4d;line-height:1.5}
  input{width:100%;padding:12px;border:1px solid #ddd2c0;border-radius:6px;font-size:1rem;margin:8px 0;box-sizing:border-box;font-family:inherit}
  button{background:#5b4a36;color:#fff;border:none;border-radius:6px;padding:12px 24px;font-size:1rem;cursor:pointer;font-family:inherit;margin-top:10px;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  .error{color:#a33;background:#fdecea;border:1px solid #e8b4b4;border-radius:6px;padding:10px;margin:10px 0;display:none}
  .success{color:#2a6b2a;background:#e8f5e8;border:1px solid #b4d8b4;border-radius:6px;padding:10px;margin:10px 0;display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
  <div class="mark">S</div>
  <h1>Set a new password</h1>
  <p>Enter your new password below.</p>
  <div class="error" id="err"></div>
  <div class="success" id="ok">Password updated. Go back to the app and sign in.</div>
  <div id="form">
    <input type="password" id="pw1" placeholder="New password" autocomplete="new-password">
    <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password">
    <button id="btn" onclick="doReset()">Set new password</button>
  </div>
</div>
<script>
  const sb = supabase.createClient(
    'https://vsziqofzrgjosvglirqh.supabase.co',
    'sb_publishable_wJWMeNCBsBK1MO5TJQR_BQ_CzWdhxBd'
  );
  async function doReset() {
    const p1 = document.getElementById('pw1').value;
    const p2 = document.getElementById('pw2').value;
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    err.style.display = 'none';
    if (!p1 || p1.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }
    if (p1 !== p2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
    document.getElementById('btn').disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) {
      err.textContent = 'Could not update password: ' + error.message;
      err.style.display = 'block';
      document.getElementById('btn').disabled = false;
      return;
    }
    document.getElementById('form').style.display = 'none';
    ok.style.display = 'block';
  }
</script>
</body>
</html>
