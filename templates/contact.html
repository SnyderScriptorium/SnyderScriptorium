<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — The Snyder Scriptorium</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.contact-page {
    min-height: calc(100vh - 220px);
    display: flex;
    flex-direction: column;
}
.contact-spacer {
    flex: 1;
    min-height: 160px;
}
.contact-form-section {
    margin-top: auto;
}
.contact-form-section textarea#message {
    min-height: 520px;
    height: 520px;
    resize: vertical;
    width: 100%;
}
</style>
</head>
<body>
<main class="site-main contact-page">
    <div class="site-title">
        <h1>Contact</h1>
    </div>

    <div class="contact-spacer" aria-hidden="true"></div>

    <section class="content-section contact-form-section">
        <h2>Send a Message</h2>
        {% if success %}<p>{{ success }}</p>{% endif %}
        {% if error %}<p>{{ error }}</p>{% endif %}
        <form method="POST">
            <label for="name">Name</label>
            <input id="name" name="name" required value="{{ name|default('') }}">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required value="{{ email|default('') }}">

            <label for="subject">Subject</label>
            <input id="subject" name="subject" value="{{ subject|default('') }}">

            <label for="message">Message</label>
            <textarea id="message" name="message" required>{{ message|default('') }}</textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
</main>
</body>
</html>
