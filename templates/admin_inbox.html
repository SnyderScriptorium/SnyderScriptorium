<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Inbox — Scriptorium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ivory:#F7F1E6;--paper:#FFFDF8;--camel2:#E8D9B5;--ink:#24333B;--brown:#5C4033;--line:#C9B78F;--muted:#6F6257}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--camel2);color:var(--ink);font-family:"Playfair Display",Georgia,serif}.shell{max-width:1100px;margin:auto}.panel{background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:25px}.card{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.list{display:grid;gap:12px}.small-actions{display:flex;gap:8px;align-items:center}.small-actions select{padding:8px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}a{color:var(--brown)}@media(max-width:700px){body{padding:10px}.panel{padding:16px}.card{flex-direction:column}.small-actions{width:100%}.small-actions select{width:100%}}</style></head><body><div class="shell"><div class="panel"><p><a href="{{ url_for('admin_dashboard') }}">← Back to Control Panel</a></p><h1>Admin Inbox</h1><p>Contact messages and reader feedback will appear here. Messages remain stored in the database until you change their status.</p><div id="inbox" class="list">Loading...</div></div></div><script>async function load(){const r=await fetch('/api/inbox');const data=await r.json();const box=document.getElementById('inbox');box.innerHTML=data.length?'':'<p>Your inbox is empty.</p>';data.forEach(m=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div><h2>'+esc(m.subject||'Message')+'</h2><p>'+esc(m.name)+' · '+esc(m.email)+'</p><p>'+esc(m.message)+'</p><small>'+esc(m.created_at||'')+'</small></div><div class="small-actions"><select onchange="status('+m.id+',this.value)"><option value="new" '+(m.status==='new'?'selected':'')+'>New</option><option value="open" '+(m.status==='open'?'selected':'')+'>Open</option><option value="in_progress" '+(m.status==='in_progress'?'selected':'')+'>In Progress</option><option value="resolved" '+(m.status==='resolved'?'selected':'')+'>Resolved</option><option value="archived" '+(m.status==='archived'?'selected':'')+'>Archived</option></select></div>';box.appendChild(d)})}async function status(id,value){await fetch('/api/inbox/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:value})});load()}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}load();</script></body></html>
