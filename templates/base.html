<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Snyder Scriptorium{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260814-3">

    <style>
        /* Global header centering override: the title and every navigation link use the same center axis. */
        .site-header {
            width: 100% !important;
            max-width: 1100px !important;
            margin: 0 auto !important;
            padding: 24px 20px 0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
        }
        .site-title {
            width: 100% !important;
            margin: 0 auto !important;
            text-align: center !important;
        }
        .site-title h1 {
            width: 100% !important;
            margin: 0 auto !important;
            text-align: center !important;
        }
        .site-navigation {
            width: 100% !important;
            max-width: 1100px !important;
            margin: 0 auto !important;
            text-align: center !important;
        }
        .site-navigation ul {
            width: 100% !important;
            margin: 0 auto !important;
            padding: 0 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            flex-wrap: wrap !important;
        }
        @media (max-width: 700px) {
            .site-header { width: 100% !important; padding: 18px 10px 0 !important; }
            .site-navigation { width: 100% !important; }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

<header class="site-header">
    <div class="site-title">
        <h1>The Snyder Scriptorium</h1>
    </div>

    <nav class="site-navigation" aria-label="Main navigation">
        <ul>
            <li><a href="{{ url_for('the_hearth') }}">The Hearth</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('the_blog') }}">The Blog</a></li>
            <li><a href="{{ url_for('kwsnyderwriting_membership') }}">K. W. Snyder Writing</a></li>
            <li><a href="{{ url_for('the_scriptorium') }}">The Scriptorium</a></li>
            <li><a href="{{ url_for('merch_shop') }}">Merch Shop</a></li>
        </ul>
    </nav>
</header>

<main class="site-main">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>&copy; 2026 The Snyder Scriptorium. All rights reserved.</p>
    <p><a href="{{ url_for('contact') }}">Contact</a></p>
    <p><a href="{{ url_for('admin_dashboard') }}">Admin</a></p>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
