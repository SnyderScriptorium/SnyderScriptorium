<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Snyder Scriptorium{% endblock %}</title>
    <!-- Linked your custom stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Master Navigation Bar -->
    <header>
        <h1>The Snyder Scriptorium</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('the_hearth') }}">The Hearth</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('the_blog') }}">The Blog</a></li>
                <li><a href="{{ url_for('the_scriptorium') }}">The Scriptorium</a></li>
                <li><a href="{{ url_for('merch_shop') }}">Merch Shop</a></li>
                <li><a href="{{ url_for('admin_dashboard') }}">Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- Dynamic Content Injection Point -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 The Snyder Scriptorium. All rights reserved.</p>
    </footer>

</body>
</html>
