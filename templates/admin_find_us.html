<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Us | Scriptorium Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F1E6;--paper:#FFFDF8;--camel:#D9C79E;--camel2:#E8D9B5;--ink:#24333B;--brown:#5C4033;--line:#C9B78F;--muted:#6F6257;--danger:#8B3F3F}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--camel2);color:var(--ink);font-family:"Playfair Display",Georgia,serif;line-height:1.6}.shell{max-width:1050px;margin:auto}.panel{background:var(--ivory);border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 16px rgba(40,30,20,.08);padding:25px}.brand{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand h1{margin:0;color:var(--brown);font-weight:400}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;margin:8px 0 4px;color:var(--brown)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit}textarea{min-height:110px;resize:vertical}button{border:1px solid var(--brown);border-radius:5px;padding:9px 15px;background:var(--brown);color:#fff;font:inherit;cursor:pointer}button.light{background:var(--paper);color:var(--brown)}button.danger{background:var(--danger);border-color:var(--danger)}.notice{padding:10px 13px;border-radius:5px;margin-bottom:15px;background:#E4EFD9;color:#405A32;border:1px solid #A9BE91}.notice.error{background:#F4DADA;color:#7A2929;border-color:#C98B8B}.list{display:grid;gap:12px;margin-top:24px}.event{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:17px}.event-top{display:flex;justify-content:space-between;gap:15px;align-items:start}.event h3{margin:0;color:var(--brown);font-weight:500}.event small{color:var(--muted)}.badge{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--brown);background:#F4ECDD}.event-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.brand{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<div class="brand"><h1>Find Us</h1><div class="actions"><button class="light" onclick="location.href='/admin'">Back to Control Panel</button><button onclick="location.href='/admin/logout'">Log Out</button></div></div>
<div class="panel">
<div id="notice" class="notice" style="display:none"></div>
<h2 id="formHeading">Add an Appearance</h2>
<form id="eventForm">
<input type="hidden" id="eventId">
<div class="grid">
<div><label for="title">Event / Appearance</label><input id="title" required></div>
<div><label for="eventDate">Date and time</label><input id="eventDate" type="datetime-local" required></div>
<div><label for="location">Location</label><input id="location" placeholder="Venue, city, state" required></div>
<div><label for="status">Visibility</label><select id="status"><option value="published">Published — visible to visitors</option><option value="draft">Draft — hidden from visitors</option></select></div>
<div class="full"><label for="description">Details</label><textarea id="description" placeholder="Tell visitors what to expect."></textarea></div>
<div class="full"><label for="link">Event link (optional)</label><input id="link" type="url" placeholder="https://..."></div>
</div>
<div class="actions" style="margin-top:15px"><button type="submit">Save Appearance</button><button type="button" class="light" onclick="resetForm()">Clear</button></div>
</form>
<div class="list" id="eventList"></div>
</div></div>
<script>
const form=document.getElementById('eventForm');
const notice=document.getElementById('notice');
const list=document.getElementById('eventList');
const idEl=document.getElementById('eventId');
function showNotice(message,error=false){notice.textContent=message;notice.className='notice'+(error?' error':'');notice.style.display='block';}
function resetForm(){form.reset();idEl.value='';document.getElementById('formHeading').textContent='Add an Appearance';document.getElementById('status').value='published';}
function formatDate(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return value;return d.toLocaleString([], {weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'});}
function editEvent(e){idEl.value=e.id;document.getElementById('title').value=e.title;document.getElementById('eventDate').value=e.event_date;document.getElementById('location').value=e.location;document.getElementById('description').value=e.description||'';document.getElementById('link').value=e.link||'';document.getElementById('status').value=e.status;document.getElementById('formHeading').textContent='Edit Appearance';window.scrollTo({top:0,behavior:'smooth'});}
async function deleteEvent(id){if(!confirm('Delete this appearance permanently?'))return;const r=await fetch('/api/find-us/'+id,{method:'DELETE'});if(!r.ok){showNotice('Unable to delete the appearance.',true);return;}showNotice('Appearance deleted.');loadEvents();}
async function loadEvents(){const r=await fetch('/api/find-us');if(!r.ok){showNotice('Unable to load appearances.',true);return;}const events=await r.json();list.innerHTML='';if(!events.length){list.innerHTML='<p>No appearances have been added yet.</p>';return;}events.forEach(e=>{const el=document.createElement('article');el.className='event';el.innerHTML=`<div class="event-top"><div><h3>${escapeHtml(e.title)}</h3><small>${escapeHtml(formatDate(e.event_date))} · ${escapeHtml(e.location)}</small></div><span class="badge">${e.status==='published'?'Published':'Draft'}</span></div>${e.description?`<p>${escapeHtml(e.description)}</p>`:''}${e.link?`<small>${escapeHtml(e.link)}</small>`:''}<div class="event-actions"><button class="light" onclick='editEvent(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button><button class="danger" onclick="deleteEvent(${e.id})">Delete</button></div>`;list.appendChild(el);});}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
form.addEventListener('submit',async ev=>{ev.preventDefault();const id=idEl.value;const data={title:document.getElementById('title').value,event_date:document.getElementById('eventDate').value,location:document.getElementById('location').value,description:document.getElementById('description').value,link:document.getElementById('link').value,status:document.getElementById('status').value};const r=await fetch(id?'/api/find-us/'+id:'/api/find-us',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok){showNotice(result.error||'Unable to save appearance.',true);return;}showNotice(id?'Appearance updated.':'Appearance added.');resetForm();loadEvents();});
loadEvents();
</script>
</body>
</html>
