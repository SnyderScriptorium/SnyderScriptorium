<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Us | Scriptorium Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F1E6;--paper:#FFFDF8;--camel2:#E8D9B5;--ink:#24333B;--brown:#5C4033;--line:#C9B78F;--muted:#6F6257;--danger:#8B3F3F;--accent:#75695D}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--camel2);color:var(--ink);font-family:"Playfair Display",Georgia,serif;line-height:1.6}.shell{max-width:1100px;margin:auto}.panel{background:var(--ivory);border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 16px rgba(40,30,20,.08);padding:25px}.brand{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand h1{margin:0;color:var(--brown);font-weight:400}.actions{display:flex;gap:10px;flex-wrap:wrap}label{display:block;margin:8px 0 4px;color:var(--brown)}input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit}textarea{min-height:130px;resize:vertical}button{border:1px solid var(--brown);border-radius:5px;padding:9px 15px;background:var(--brown);color:#fff;font:inherit;cursor:pointer}button.light{background:var(--paper);color:var(--brown)}button.danger{background:var(--danger);border-color:var(--danger)}button.secondary{background:var(--accent);border-color:var(--accent)}.notice{padding:10px 13px;border-radius:5px;margin-bottom:15px;background:#E4EFD9;color:#405A32;border:1px solid #A9BE91}.notice.error{background:#F4DADA;color:#7A2929;border-color:#C98B8B}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px;margin-top:12px}.check input{width:auto}.list{display:grid;gap:12px;margin-top:28px}.event{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:18px}.event-top{display:flex;justify-content:space-between;gap:15px;align-items:start}.event h3{margin:0;color:var(--brown);font-weight:500}.event small{color:var(--muted)}.badge{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--brown);background:#F4ECDD}.badge.off{opacity:.65}.featured{border-width:2px}.event-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.event-details{white-space:pre-line}.empty{color:var(--muted);font-style:italic}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.brand{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<div class="brand"><h1>Find Us</h1><div class="actions"><button class="light" onclick="location.href='/admin'">Back to Control Panel</button><button onclick="location.href='/admin/logout'">Log Out</button></div></div>
<div class="panel">
<div id="notice" class="notice" style="display:none"></div>
<h2 id="formHeading">Add an Appearance</h2>
<form id="eventForm">
<input type="hidden" id="eventId">
<div class="grid">
<div><label for="title">Event / Appearance</label><input id="title" required></div>
<div><label for="eventDate">Date</label><input id="eventDate" type="date" required></div>
<div><label for="startTime">Start time</label><input id="startTime" type="time"></div>
<div><label for="endTime">End time</label><input id="endTime" type="time"></div>
<div><label for="location">Location / Venue</label><input id="location" placeholder="Venue, city, state"></div>
<div><label for="address">Address</label><input id="address" placeholder="Street, city, state, ZIP"></div>
<div class="full"><label for="description">Description / Details</label><textarea id="description" placeholder="Tell visitors what to expect."></textarea></div>
<div><label for="websiteUrl">Event website (optional)</label><input id="websiteUrl" type="url" placeholder="https://..."></div>
<div><label for="imageUrl">Image URL (optional)</label><input id="imageUrl" type="url" placeholder="https://..."></div>
</div>
<label class="check"><input id="isActive" type="checkbox" checked> Active — show this event on Find Us when its date arrives</label>
<label class="check"><input id="isFeatured" type="checkbox"> Featured appearance</label>
<div class="actions" style="margin-top:15px"><button type="submit">Save Appearance</button><button type="button" class="light" onclick="resetForm()">Clear</button></div>
</form>
<div class="list" id="eventList"></div>
</div></div>
<script>
const form=document.getElementById('eventForm'),notice=document.getElementById('notice'),list=document.getElementById('eventList'),idEl=document.getElementById('eventId');
function showNotice(message,error=false){notice.textContent=message;notice.className='notice'+(error?' error':'');notice.style.display='block';}
function resetForm(){form.reset();idEl.value='';document.getElementById('formHeading').textContent='Add an Appearance';document.getElementById('isActive').checked=true;document.getElementById('isFeatured').checked=false;}
function formatDate(value){const d=new Date(value+'T12:00:00');return Number.isNaN(d.getTime())?value:d.toLocaleDateString([], {weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function formatTime(value){if(!value)return '';const [h,m]=value.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function editEvent(e){idEl.value=e.id;document.getElementById('title').value=e.title;document.getElementById('eventDate').value=e.date;document.getElementById('startTime').value=e.start_time||'';document.getElementById('endTime').value=e.end_time||'';document.getElementById('location').value=e.location||'';document.getElementById('address').value=e.address||'';document.getElementById('description').value=e.description||'';document.getElementById('websiteUrl').value=e.website_url||'';document.getElementById('imageUrl').value=e.image_url||'';document.getElementById('isActive').checked=!!e.is_active;document.getElementById('isFeatured').checked=!!e.is_featured;document.getElementById('formHeading').textContent='Edit Appearance';window.scrollTo({top:0,behavior:'smooth'});}
async function deleteEvent(id){if(!confirm('Delete this appearance permanently?'))return;const r=await fetch('/api/find-us/'+id,{method:'DELETE',credentials:'same-origin'});if(!r.ok){showNotice('Unable to delete the appearance.',true);return;}showNotice('Appearance deleted.');loadEvents();}
async function toggleActive(id,current){const r=await fetch('/api/find-us/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({is_active:!current})});const d=await r.json().catch(()=>({}));if(!r.ok){showNotice(d.error||'Unable to update the appearance.',true);return;}loadEvents();}
async function loadEvents(){const r=await fetch('/api/find-us',{credentials:'same-origin'});if(!r.ok){showNotice('Unable to load appearances. Please make sure you are still signed in.',true);return;}const events=await r.json();list.innerHTML='';if(!events.length){list.innerHTML='<p class="empty">No appearances have been added yet.</p>';return;}events.forEach(e=>{const el=document.createElement('article');el.className='event'+(e.is_featured?' featured':'');const active=e.is_active?'Active':'Hidden';el.innerHTML=`<div class="event-top"><div><h3>${escapeHtml(e.title)}</h3><small>${escapeHtml(formatDate(e.date))}${e.start_time?' · '+escapeHtml(formatTime(e.start_time)):''}${e.end_time?'–'+escapeHtml(formatTime(e.end_time)):''}${e.location?' · '+escapeHtml(e.location):''}</small></div><span class="badge ${e.is_active?'':'off'}">${active}${e.is_featured?' · Featured':''}</span></div>${e.address?`<div>${escapeHtml(e.address)}</div>`:''}${e.description?`<p class="event-details">${escapeHtml(e.description)}</p>`:''}<div class="event-actions"><button class="light" onclick='editEvent(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button><button class="secondary" onclick="toggleActive(${e.id},${!!e.is_active})">${e.is_active?'Hide':'Activate'}</button><button class="danger" onclick="deleteEvent(${e.id})">Delete</button></div>`;list.appendChild(el);});}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
form.addEventListener('submit',async ev=>{ev.preventDefault();const id=idEl.value;const data={title:document.getElementById('title').value,date:document.getElementById('eventDate').value,start_time:document.getElementById('startTime').value,end_time:document.getElementById('endTime').value,location:document.getElementById('location').value,address:document.getElementById('address').value,description:document.getElementById('description').value,website_url:document.getElementById('websiteUrl').value,image_url:document.getElementById('imageUrl').value,is_active:document.getElementById('isActive').checked,is_featured:document.getElementById('isFeatured').checked};const r=await fetch(id?'/api/find-us/'+id:'/api/find-us',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const result=await r.json().catch(()=>({}));if(!r.ok){showNotice(result.error||'Unable to save appearance.',true);return;}showNotice(id?'Appearance updated.':'Appearance added.');resetForm();loadEvents();});
loadEvents();
</script>
</body>
</html>
