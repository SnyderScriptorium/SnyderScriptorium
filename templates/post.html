{% extends "base.html" %}
{% block title %}{{ post['title'] }} — Snyder Scriptorium{% endblock %}
{% block content %}
<article class="content-section" style="max-width:780px;margin:0 auto;">
  <p><a href="{{ back_url }}">← Back</a></p>
  <h1>{{ post['title'] }}</h1>
  <p class="private-label">{{ post['category_name'] }} · {{ post['date_published'] }}</p>
  <div class="preview" style="margin-top:25px;line-height:1.85;">
    {{ post['content']|safe }}
  </div>
</article>
{% endblock %}
